<div class="min-h-screen bg-gray-50 p-8">
  <div class="bg-black text-green-400 p-4 font-mono text-sm overflow-auto mb-4">
  DEBUG OUTPUT:
  <pre>{{ trips | json }}</pre>
</div>
  <div class="max-w-6xl mx-auto">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">My Football Journey</h1>
      <button (click)="auth.logout()" class="text-red-600 hover:text-red-800 font-medium">
        Logout
      </button>
    </div>

    <!-- Action Bar -->
    <div class="mb-6 flex justify-end">
      <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 shadow-sm">
        + Plan New Trip
      </button>
    </div>

    <!-- Trips Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <!-- Angular Control Flow to loop through trips -->
      @for (trip of trips; track trip.id) {
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 hover:shadow-md transition-shadow cursor-pointer">
          <h2 class="text-xl font-semibold text-gray-800 mb-2">{{ trip.name }}</h2>
          <div class="text-sm text-gray-500 mb-4">
            {{ trip.startDate | date:'mediumDate' }} - {{ trip.endDate | date:'mediumDate' }}
          </div>
          <div class="flex justify-between items-center border-t pt-4">
            <span class="text-sm font-medium text-gray-500">Budget</span>
            <span class="text-lg font-bold text-green-600">₹{{ trip.budget }}</span>
          </div>
        </div>
      } @empty {
        <div class="col-span-full text-center py-12 bg-white rounded-lg border border-dashed border-gray-300">
          <p class="text-gray-500">No trips planned yet. Time to book a flight!</p>
        </div>
      }
      
    </div>
  </div>
</div>
